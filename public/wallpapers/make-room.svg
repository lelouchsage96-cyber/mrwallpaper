<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs><filter id="g-make-room" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="overlay"/>
  </filter></defs>
  <rect width="1080" height="1920" fill="#16140f"/>
  <g filter="url(#g-make-room)">
          <text x="540" y="900" text-anchor="middle" fill="#e4d7c3" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="-0.5">Make room.</text>
          <text x="540" y="970" text-anchor="middle" fill="#e4d7c3" opacity="0.55" font-family="Georgia, serif" font-size="22" letter-spacing="4">YOUR SCREEN. YOUR STYLE.</text>
        </g>
</svg>