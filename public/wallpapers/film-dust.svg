<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs><filter id="g-film-dust" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="overlay"/>
  </filter></defs>
  <rect width="1080" height="1920" fill="#2a1f22"/>
  <g filter="url(#g-film-dust)">
          <rect width="1080" height="1920" fill="#2a1f22"/>
          <rect y="640" width="1080" height="640" fill="#c9a3a8" opacity="0.35"/>
        </g>
</svg>