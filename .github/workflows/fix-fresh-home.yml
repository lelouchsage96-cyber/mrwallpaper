name: Fix Fresh Wallpapers feed

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch homepage feed logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/server/api.ts')
          text = path.read_text()
          old = '''    const wotdCard =
      (wotd[0] && wotd[0].deviceType !== "tablet" ? wotd[0] : null) ?? trendingRaw[0] ?? wotd[0] ?? null;
    const skip = new Set<string>();
    if (wotdCard) skip.add(wotdCard.id);
    const trending = trendingRaw.filter((w) => !skip.has(w.id)).slice(0, 16);
    trending.forEach((w) => skip.add(w.id));
    const fresh = freshRaw.filter((w) => !skip.has(w.id)).slice(0, 8);
'''
          new = '''    const wotdCard = wotd[0] ?? trendingRaw[0] ?? null;
    const wotdId = wotdCard?.id ?? null;
    const trending = trendingRaw.filter((w) => w.id !== wotdId).slice(0, 16);
    const fresh = freshRaw.filter((w) => w.id !== wotdId).slice(0, 8);
'''
          if old not in text:
              raise SystemExit('Expected homepage feed block was not found; refusing to make an unsafe edit.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-fresh-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/server/api.ts .github/workflows/fix-fresh-home.yml
          git commit -m "Show latest wallpapers in Fresh section"
          git push origin HEAD:main
