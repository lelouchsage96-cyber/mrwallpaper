name: Sync all icons to iOS artwork

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-icons-to-ios.py"
      - ".github/workflows/sync-icons-to-ios.yml"

permissions:
  contents: write

jobs:
  sync-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate all icons from the iOS source
        run: python scripts/sync-icons-to-ios.py
      - name: Commit synchronized icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/routes/__root.tsx
          if git diff --cached --quiet; then
            echo "Icons already synchronized."
            exit 0
          fi
          git commit -m "Match all platform icons to iOS artwork"
          git push origin HEAD:main
