name: Refresh desktop PWA icons

on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-desktop-icons.py"
      - ".github/workflows/refresh-desktop-icons.yml"

permissions:
  contents: write

jobs:
  refresh-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate exact-artwork desktop and PWA icons
        run: python scripts/refresh-desktop-icons.py
      - name: Commit generated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/routes/__root.tsx
          if git diff --cached --quiet; then
            echo "Icon assets already current."
            exit 0
          fi
          git commit -m "Restore exact artwork for desktop PWA icons"
          git push origin HEAD:main
